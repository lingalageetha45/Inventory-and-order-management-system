$kind: collection
description: |-
  Base URL: {{baseUrl}}
  1. Login
  2. Put access_token into collection variable token
  3. Use Admin/Staff for manage APIs, Customer for orders/payments/reviews
variables:
  baseUrl: http://localhost:8000/api/v1
  token: ""
  product_id: "1"
  category_id: "1"
  order_id: "1"
  payment_id: "1"
  review_id: "1"
  notification_id: "1"
auth:
  - id: 20a67bdf-288a-41f5-b49e-e6cefb85d4ff
    type: bearer
    name: bearer auth
    credentials:
      token: "{{token}}"
